name: Bug report
description: Something in the app doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A short, exact description beats a long one.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what the app did instead. Screenshots help.
      placeholder: On the Connectors tab I pressed Test on a stdio server and …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a QA & Testing agency
        2. Open Connectors → Add a connector → Your own server
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tyslin Studio version
      description: Settings → About, or the version in the status bar.
      placeholder: 0.6.11
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (.AppImage)
        - Linux (.deb)
        - Linux (snap)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Built from source
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Models and adapters involved
      description: For example "Lead on Claude, workers on Gemini CLI with a key", or "Codex signed in with ChatGPT".
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Anything shown in the app, or from the terminal when running `npm run dev`. Remove keys and tokens before pasting.
      render: text
