name: Release

# Builds installers for macOS, Windows and Linux and attaches them to a
# GitHub Release. Runs when a version tag (v0.1.0, v0.2.0, ...) is pushed,
# or when a release is created from the GitHub website with a new tag.
# Can also be started by hand from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (for example v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Windows
            os: windows-latest
            target: --win
          - name: Linux
            os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Package installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Builds are unsigned until an Apple Developer ID and a Windows
          # certificate are added as repository secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: tyslin-studio-${{ matrix.name }}
          # Installers, plus the files installed apps read to update themselves:
          # latest*.yml (version info), *.blockmap (partial downloads), mac *.zip.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Tyslin Studio ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
