appId: ai.tyslin.studio
productName: Tyslin Studio
copyright: Copyright © 2026 ReactiveSpace
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
icon: resources/icon.png
mac:
  category: public.app-category.productivity
  artifactName: Tyslin-Studio-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  artifactName: Tyslin-Studio-${version}-windows-${arch}-setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Utility
  artifactName: Tyslin-Studio-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: info@tyslin.ai
