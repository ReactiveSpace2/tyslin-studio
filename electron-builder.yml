appId: ai.tyslin.studio
productName: Tyslin Studio
copyright: Copyright © 2026 ReactiveSpace
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
icon: resources/icon.png
mac:
  category: public.app-category.productivity
  artifactName: Tyslin-Studio-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    # The updater installs macOS updates from the zip, not the dmg.
    - target: zip
      arch:
        - arm64
        - x64
win:
  artifactName: Tyslin-Studio-${version}-windows-${arch}-setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Utility
  artifactName: Tyslin-Studio-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    # Published to the Snap Store so Ubuntu App Center shows the name, icon and
    # publisher (it shows "Unknown publisher" and a warning for any local .deb).
    - target: snap
      arch:
        - x64
  maintainer: info@tyslin.ai
deb:
  # Adds an AppArmor profile so the app can start on Ubuntu 23.10+ (see the script).
  afterInstall: resources/linux/after-install.sh
  afterRemove: resources/linux/after-remove.sh
snap:
  summary: Run your own AI agency.
  grade: stable
  # Classic, not strict: the app runs external agent engines from the user's
  # PATH, their official installers, and works on project folders anywhere.
  # Needs a one-time classic approval from the Snap Store.
  confinement: classic
# Installed apps read latest*.yml from GitHub Releases to find updates (src/main/updater.ts).
publish:
  provider: github
  owner: ReactiveSpace2
  repo: tyslin-studio
  releaseType: release
